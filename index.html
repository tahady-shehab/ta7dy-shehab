<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي شهاب</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#080b14;
color:#fff;
min-height:100vh;
}

.app{
max-width:700px;
margin:auto;
min-height:100vh;
padding:24px 16px;
}

.card{
background:#111625;
border:1px solid #252d42;
border-radius:24px;
padding:25px;
box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.center{text-align:center}

.logo{
text-align:center;
margin:20px 0 35px;
}

.logo h1{
font-size:42px;
margin:0;
}

.logo p{
color:#aeb6c8;
font-size:17px;
}

h2{
font-size:28px;
margin-top:0;
}

.subtitle{
color:#b7bfd0;
line-height:1.8;
}

button{
border:0;
border-radius:15px;
padding:15px 22px;
font-size:17px;
font-weight:bold;
cursor:pointer;
width:100%;
margin-top:14px;
}

.primary{
background:#fff;
color:#080b14;
}

.secondary{
background:#222a3d;
color:white;
}

.hidden{display:none}

.badge{
display:inline-block;
padding:7px 12px;
border-radius:30px;
background:#222a3d;
color:#dce3f2;
font-size:13px;
margin-bottom:15px;
}

.rules{
list-style:none;
padding:0;
line-height:2;
color:#d8deeb;
}

.progress{
color:#aeb6c8;
font-size:14px;
margin-bottom:15px;
}

.shehab-time{
background:#191f31;
border-radius:18px;
padding:18px;
text-align:center;
margin-bottom:22px;
}

.shehab-time small{
display:block;
color:#aeb6c8;
margin-bottom:5px;
}

.time{
font-size:42px;
font-weight:bold;
direction:ltr;
}

.question{
font-size:24px;
line-height:1.7;
margin-bottom:18px;
}

textarea{
width:100%;
min-height:150px;
resize:vertical;
border-radius:16px;
border:1px solid #30394f;
background:#0b0f1b;
color:white;
padding:15px;
font-size:17px;
outline:none;
}

.result-number{
font-size:65px;
font-weight:bold;
margin:15px 0;
}

.result-box{
background:#191f31;
border-radius:18px;
padding:20px;
margin-top:18px;
}

.strength{
font-size:20px;
line-height:1.7;
}

.warning{
color:#ffcf70;
font-size:13px;
margin-top:15px;
line-height:1.6;
}
</style>
</head>

<body>

<div class="app">

<section id="home" class="card center">

<div class="logo">
<h1>🧠 تحدي شهاب</h1
